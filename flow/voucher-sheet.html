<!DOCTYPE html>
<!--
  The print template the flow produces.

  This file is the readable reference copy. The flow builds the same markup by
  string-concatenating the header block, one card block per voucher, and the footer.
  Edit here first, check it in a browser's print preview, then port the change into
  the flow's Compose actions.

  Placeholders the flow substitutes:
    {{EMPLOYEE}}   employee display name
    {{COUNT}}      number of vouchers
    {{GENERATED}}  timestamp string, already formatted by the app
    {{CARDS}}      the concatenated card blocks

  There are no <img> tags anywhere in here, and that is deliberate. SharePoint's
  Convert file action renders server-side with no network access: it will draw
  anything embedded in the file and will not fetch anything referenced by it.
  The barcodes below are therefore drawn as ordinary <i> elements with widths —
  no image, no font, no request. See docs/ARCHITECTURE.md.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gift vouchers</title>
<style>
  @page { size: A4; margin: 12mm; }

  body {
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    color: #201f1e;
    margin: 0;
  }

  header {
    border-bottom: 2px solid #742774;
    padding-bottom: 8px;
    margin-bottom: 14px;
  }
  header h1 { font-size: 19px; margin: 0 0 3px 0; font-weight: 600; }
  header .meta { font-size: 11px; color: #605e5c; }

  .sheet {
    display: flex;
    flex-wrap: wrap;
    gap: 8mm;
  }

  /* Two cards across an A4 page with 12mm margins. 186mm usable / 2, less the gap. */
  .card {
    width: 87mm;
    box-sizing: border-box;
    border: 1px solid #c8c6c4;
    border-radius: 3mm;
    padding: 5mm;
    text-align: center;

    /* The reason this is HTML and not the PDF() function: a card must never
       be sliced in half by a page boundary. */
    page-break-inside: avoid;
    break-inside: avoid;
  }

  .card .batch {
    font-size: 13px;
    font-weight: 600;
    color: #742774;
    margin-bottom: 3mm;
  }

  /* ---- the barcode ----------------------------------------------------
     Code 39, drawn as bars. Each character is nine alternating elements
     starting with a bar; three of the nine are wide. A 3:1 wide-to-narrow
     ratio is comfortably inside spec.

     The quiet zone is not decoration — Code 39 requires at least ten narrow
     widths of blank space either side or scanners will not see the barcode
     at all. That is what the 5mm padding is doing.
     -------------------------------------------------------------------- */
  .bc {
    font-size: 0;          /* kills inline-block whitespace between elements */
    white-space: nowrap;
    background: #fff;
    padding: 2mm 5mm;      /* quiet zone */
    margin-bottom: 2mm;
  }
  .bc i {
    display: inline-block;
    height: 14mm;
    vertical-align: top;
  }
  .bn { width: 0.4mm; background: #000; }   /* narrow bar */
  .bw { width: 1.2mm; background: #000; }   /* wide bar */
  .sn { width: 0.4mm; background: #fff; }   /* narrow space */
  .sw { width: 1.2mm; background: #fff; }   /* wide space */

  /* The code is printed as text as well as encoded. If anything at all goes
     wrong with the bars, the voucher is still redeemable by hand. */
  .card .code {
    font-family: Consolas, "Courier New", monospace;
    font-size: 17px;
    letter-spacing: 1px;
    font-weight: 600;
    margin-bottom: 2mm;
  }

  .card .who  { font-size: 12px; color: #323130; }
  .card .when { font-size: 9px; color: #a19f9d; margin-top: 2mm; }

  footer {
    margin-top: 8mm;
    font-size: 9px;
    color: #a19f9d;
    text-align: center;
  }
</style>
</head>
<body>

<header>
  <h1>Gift vouchers — {{EMPLOYEE}}</h1>
  <div class="meta">{{COUNT}} voucher(s) · generated {{GENERATED}}</div>
</header>

<div class="sheet">
  {{CARDS}}
</div>

<footer>Cut along the card borders. Each code may be redeemed once.</footer>

</body>
</html>

<!--
  One card block. The flow emits this per record in the cards JSON. The contents of
  .bc come straight from the app, which builds them in Power Fx from the Code 39
  table — see app/README.md.

  <div class="card">
    <div class="batch">Rosh Hashana</div>
    <div class="bc"><i class="bn"></i><i class="sw"></i><i class="bn"></i>…</div>
    <div class="code">T123</div>
    <div class="who">Judith Galili</div>
    <div class="when">Generated 27 Jul 2026, 09:12</div>
  </div>
-->
