<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="1420" viewBox="0 0 1180 1420" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#742774"/>
    </marker>
    <marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a8886"/>
    </marker>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.10"/>
    </filter>
    <style>
      .band      { fill:#fbfbfa; stroke:#e6e4e2; rx:14; }
      .bandTitle { font-size:15px; font-weight:700; fill:#8a8886; letter-spacing:1.6px; }
      .bandSub   { font-size:13px; fill:#a19f9d; }
      .box       { rx:8; filter:url(#soft); }
      .appBox    { fill:#f5eef7; stroke:#c9a3d4; }
      .spBox     { fill:#eef4fb; stroke:#a8c4e4; }
      .flowBox   { fill:#eef7f4; stroke:#9fcfbe; }
      .outBox    { fill:#fdf6ec; stroke:#e6c68a; }
      .h         { font-size:16px; font-weight:600; fill:#201f1e; }
      .t         { font-size:13px; fill:#484644; }
      .s         { font-size:12px; fill:#605e5c; }
      .mono      { font-family:Consolas, Menlo, monospace; font-size:12.5px; fill:#3b3a39; }
      .monoK     { font-family:Consolas, Menlo, monospace; font-size:12.5px; fill:#8250df; font-weight:600; }
      .edge      { stroke:#742774; stroke-width:2; fill:none; marker-end:url(#arrow); }
      .edgeG     { stroke:#8a8886; stroke-width:1.6; fill:none; marker-end:url(#arrowG); stroke-dasharray:5 4; }
      .lbl       { font-size:11.5px; fill:#605e5c; }
      .pill      { rx:11; fill:#ffffff; stroke:#d2d0ce; }
      .pillT     { font-size:12px; fill:#323130; }
      .card      { rx:6; fill:#ffffff; stroke:#d8d6d4; }
    </style>
  </defs>

  <rect width="1180" height="1420" fill="#ffffff"/>

  <text x="40" y="46" font-size="24" font-weight="700" fill="#201f1e">Gift Voucher Kiosk — from a card scan to a printable sheet</text>
  <text x="40" y="72" font-size="14" fill="#605e5c">One SharePoint row can hold many voucher codes. One voucher code becomes one printed card.</text>

  <!-- ============ BAND 1 : SCAN ============ -->
  <rect class="band" x="30" y="100" width="1120" height="286"/>
  <text class="bandTitle" x="54" y="130">1 · SCAN</text>
  <text class="bandSub" x="140" y="130">a handheld scanner types the employee's email and presses Enter</text>

  <rect class="box appBox" x="54" y="150" width="300" height="212"/>
  <text class="h" x="74" y="178">Scan screen</text>
  <text class="s" x="74" y="197">canvas app · tablet layout</text>
  <rect class="pill" x="74" y="212" width="260" height="30"/>
  <text class="pillT" x="86" y="232">txtScan — always focused</text>
  <rect class="pill" x="74" y="250" width="260" height="30"/>
  <text class="pillT" x="86" y="270">DelayOutput fires OnChange</text>
  <text class="s" x="74" y="300">Power Apps has no "on Enter" event, so</text>
  <text class="s" x="74" y="317">DelayOutput waits for typing to stop —</text>
  <text class="s" x="74" y="334">which is exactly what a wedge scanner</text>
  <text class="s" x="74" y="351">produces: a fast burst, then silence.</text>

  <path class="edge" d="M364,256 L444,256"/>
  <text class="lbl" x="368" y="246">email</text>

  <rect class="box spBox" x="454" y="150" width="320" height="212"/>
  <text class="h" x="474" y="178">GiftVouchers</text>
  <text class="s" x="474" y="197">SharePoint list on DevSite</text>
  <text class="mono" x="474" y="224">Title      <tspan class="monoK">"Rosh Hashana"</tspan></text>
  <text class="mono" x="474" y="246">Employee   <tspan class="monoK">person</tspan></text>
  <text class="mono" x="474" y="268">QRCodes    <tspan class="monoK">"T123;T543;T666"</tspan></text>
  <text class="mono" x="474" y="290">number     <tspan class="monoK">3</tspan></text>
  <text class="s" x="474" y="320">Filter(GiftVouchers, Employee.Email = id)</text>
  <text class="s" x="474" y="340">Equality on a person's email is delegable,</text>
  <text class="s" x="474" y="357">so this survives past 2,000 rows.</text>

  <path class="edge" d="M784,256 L864,256"/>
  <text class="lbl" x="788" y="246">rows</text>

  <rect class="box appBox" x="874" y="150" width="252" height="212"/>
  <text class="h" x="894" y="178">colBatches</text>
  <text class="s" x="894" y="197">one record per batch row</text>
  <rect class="card" x="894" y="214" width="212" height="40"/>
  <text class="s" x="906" y="231">Rosh Hashana</text>
  <text class="mono" x="906" y="248">T123;T543;T666</text>
  <rect class="card" x="894" y="262" width="212" height="40"/>
  <text class="s" x="906" y="279">Shavuot</text>
  <text class="mono" x="906" y="296">T988;T443</text>
  <text class="s" x="894" y="326">Two rows in — but five</text>
  <text class="s" x="894" y="343">vouchers need printing.</text>

  <!-- ============ BAND 2 : EXPLODE ============ -->
  <rect class="band" x="30" y="408" width="1120" height="330"/>
  <text class="bandTitle" x="54" y="438">2 · EXPLODE</text>
  <text class="bandSub" x="170" y="438">one row with many codes becomes many records with one code each</text>

  <rect class="box appBox" x="54" y="458" width="560" height="260"/>
  <text class="h" x="74" y="486">Split → AddColumns → Ungroup</text>

  <text class="mono" x="74" y="514">ClearCollect(colCards,</text>
  <text class="mono" x="74" y="534">  ForAll(</text>
  <text class="mono" x="74" y="554">    Ungroup(</text>
  <text class="mono" x="74" y="574">      AddColumns(colBatches, <tspan class="monoK">"Codes"</tspan>,</text>
  <text class="mono" x="74" y="594">        Filter(Split(QRCodes, <tspan class="monoK">";"</tspan>),</text>
  <text class="mono" x="74" y="614">               !IsBlank(Trim(Result)))</text>
  <text class="mono" x="74" y="634">      ), <tspan class="monoK">"Codes"</tspan></text>
  <text class="mono" x="74" y="654">    ), { Batch: Title, Code: Trim(Result), … }</text>
  <text class="mono" x="74" y="674">  )</text>
  <text class="mono" x="74" y="694">)</text>

  <rect class="box appBox" x="636" y="458" width="490" height="260"/>
  <text class="h" x="656" y="486">colCards — five records</text>

  <rect class="card" x="656" y="500" width="450" height="30"/>
  <text class="mono" x="668" y="520">Rosh Hashana  ·  <tspan class="monoK">T123</tspan></text>
  <rect class="card" x="656" y="536" width="450" height="30"/>
  <text class="mono" x="668" y="556">Rosh Hashana  ·  <tspan class="monoK">T543</tspan></text>
  <rect class="card" x="656" y="572" width="450" height="30"/>
  <text class="mono" x="668" y="592">Rosh Hashana  ·  <tspan class="monoK">T666</tspan></text>
  <rect class="card" x="656" y="608" width="450" height="30"/>
  <text class="mono" x="668" y="628">Shavuot       ·  <tspan class="monoK">T988</tspan></text>
  <rect class="card" x="656" y="644" width="450" height="30"/>
  <text class="mono" x="668" y="664">Shavuot       ·  <tspan class="monoK">T443</tspan></text>

  <text class="s" x="656" y="696">The blank filter matters: a trailing "T123;T543;" would otherwise print an empty card.</text>

  <!-- ============ BAND 3 : PRINT ============ -->
  <rect class="band" x="30" y="760" width="1120" height="620"/>
  <text class="bandTitle" x="54" y="790">3 · PRINT</text>
  <text class="bandSub" x="140" y="790">the app previews on screen; the flow renders the page that actually prints</text>

  <rect class="box appBox" x="54" y="810" width="330" height="312"/>
  <text class="h" x="74" y="838">Voucher screen</text>
  <text class="s" x="74" y="857">a gallery over colCards</text>

  <rect class="card" x="74" y="874" width="140" height="150"/>
  <text class="s" x="86" y="894">Rosh Hashana</text>
  <rect x="86" y="902" width="72" height="72" rx="3" fill="#201f1e"/>
  <rect x="94" y="910" width="18" height="18" fill="#ffffff"/>
  <rect x="132" y="910" width="18" height="18" fill="#ffffff"/>
  <rect x="94" y="948" width="18" height="18" fill="#ffffff"/>
  <rect x="118" y="934" width="10" height="10" fill="#ffffff"/>
  <text class="mono" x="86" y="994">T123</text>
  <text class="s" x="86" y="1012">Judith Galili</text>

  <rect class="card" x="224" y="874" width="140" height="150"/>
  <text class="s" x="236" y="894">Rosh Hashana</text>
  <rect x="236" y="902" width="72" height="72" rx="3" fill="#201f1e"/>
  <rect x="244" y="910" width="18" height="18" fill="#ffffff"/>
  <rect x="282" y="910" width="18" height="18" fill="#ffffff"/>
  <rect x="244" y="948" width="18" height="18" fill="#ffffff"/>
  <rect x="266" y="932" width="12" height="12" fill="#ffffff"/>
  <text class="mono" x="236" y="994">T543</text>
  <text class="s" x="236" y="1012">Judith Galili</text>

  <text class="s" x="74" y="1040">QR images come from a public API — see the</text>
  <text class="s" x="74" y="1057">note below before using real voucher codes.</text>
  <text class="s" x="74" y="1074">The code prints as text too, so a failed image</text>
  <text class="s" x="74" y="1091">never means an unusable voucher.</text>

  <path class="edge" d="M394,930 L474,930"/>
  <text class="lbl" x="396" y="920">JSON(colCards)</text>

  <rect class="box flowBox" x="484" y="810" width="330" height="312"/>
  <text class="h" x="504" y="838">Cloud flow</text>
  <text class="s" x="504" y="857">Power Automate · no premium connector</text>

  <rect class="pill" x="504" y="874" width="290" height="30"/>
  <text class="pillT" x="516" y="894">1 · Power Apps V2 trigger — 3 inputs</text>
  <rect class="pill" x="504" y="912" width="290" height="30"/>
  <text class="pillT" x="516" y="932">2 · build A4 HTML, one card per code</text>
  <rect class="pill" x="504" y="950" width="290" height="30"/>
  <text class="pillT" x="516" y="970">3 · write .html to the library</text>
  <rect class="pill" x="504" y="988" width="290" height="30"/>
  <text class="pillT" x="516" y="1008">4 · SharePoint Convert file → PDF</text>
  <rect class="pill" x="504" y="1026" width="290" height="30"/>
  <text class="pillT" x="516" y="1046">5 · share link → back to the app</text>

  <text class="s" x="504" y="1074">Convert file is the same Graph renderer behind</text>
  <text class="s" x="504" y="1091">"Download as PDF" in Office. It costs nothing.</text>

  <path class="edge" d="M824,930 L904,930"/>
  <text class="lbl" x="828" y="920">pdfurl</text>

  <rect class="box outBox" x="914" y="810" width="212" height="312"/>
  <text class="h" x="934" y="838">The printed sheet</text>
  <text class="s" x="934" y="857">A4, page-break-inside: avoid</text>

  <rect x="934" y="874" width="172" height="180" rx="4" fill="#ffffff" stroke="#d8d6d4"/>
  <text class="s" x="946" y="894">Judith Galili · 5 vouchers</text>
  <line x1="946" y1="902" x2="1094" y2="902" stroke="#e6e4e2"/>
  <rect x="946" y="912" width="66" height="60" rx="3" fill="#faf9f8" stroke="#e1dfdd"/>
  <rect x="1028" y="912" width="66" height="60" rx="3" fill="#faf9f8" stroke="#e1dfdd"/>
  <rect x="946" y="980" width="66" height="60" rx="3" fill="#faf9f8" stroke="#e1dfdd"/>
  <rect x="1028" y="980" width="66" height="60" rx="3" fill="#faf9f8" stroke="#e1dfdd"/>

  <text class="s" x="934" y="1074">Each card carries the batch, the QR,</text>
  <text class="s" x="934" y="1091">the code, the name and the timestamp.</text>

  <!-- footer note -->
  <rect x="54" y="1130" width="1072" height="216" rx="8" fill="#fdf6ec" stroke="#e6c68a"/>
  <text class="h" x="76" y="1160">Two things worth knowing before this handles real money</text>
  <text class="t" x="76" y="1190">The QR images are generated by a public service, which means every voucher code is sent to a third</text>
  <text class="t" x="76" y="1212">party in a URL. That is fine for the test codes here and wrong for redeemable vouchers. The endpoint</text>
  <text class="t" x="76" y="1234">appears in exactly two places — the app's image control and the flow's HTML — so swapping it for an</text>
  <text class="t" x="76" y="1256">Azure Function or a PCF component is a two-line change.</text>
  <text class="t" x="76" y="1290">Nothing here marks a voucher as redeemed or stops it being printed twice. Anyone who can open the app</text>
  <text class="t" x="76" y="1312">and knows a colleague's email can print that colleague's vouchers. This is a handout convenience, not</text>
  <text class="t" x="76" y="1334">an issuance system, and it should not be treated as one.</text>

  <path class="edgeG" d="M590,386 L590,408"/>
  <path class="edgeG" d="M590,738 L590,760"/>
</svg>
